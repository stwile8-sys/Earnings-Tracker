name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build
        run: gradle assembleDebug -Pvc=${{ github.run_number }} --no-daemon --stacktrace

      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Earnings-Tracker.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Earnings-Tracker.apk \
            --title "Последняя сборка #${{ github.run_number }}" \
            --notes "Скачайте Earnings-Tracker.apk и установите на телефон." \
            --target ${{ github.sha }}
