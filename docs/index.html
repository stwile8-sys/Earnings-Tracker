<body>
<div id="app"></div>
<script>
'use strict';
const NB = ' ';
const MONO = 'ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace';
const MN = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MS = ['янв','фев','мар','апр','май','июн','июл','авг','сент','окт','нояб','дек'];
const MG = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WF = ['понедельник','вторник','среда','четверг','пятница','суббота','воскресенье'];
const WS = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const PN = { w: 'Неделя', m: 'Месяц', y: 'Год' };
const CATS = [
  { id: 'work', name: 'Заработок', color: '#3DDC97' },
  { id: 'tips', name: 'Чаевые', color: '#5BB0FF' },
  { id: 'other', name: 'Прочее', color: '#F2C14E' },
];
const catOf = x => CATS.find(c => c.id === x.cat) || CATS[0];

const fmt = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, NB);
const money = n => fmt(n) + NB + '₽';
const short = v => { if (v < 1000) return String(v); const k = v / 1000; return (k >= 10 || k === Math.floor(k) ? String(Math.floor(k)) : k.toFixed(1).replace('.', ',')) + 'к'; };
const tagNum = v => v < 1000 ? String(v) : (v / 1000).toFixed(1).replace('.', ',').replace(/,0$/, '') + 'к';
const pct = p => (p >= 0 ? '+' : '−') + Math.abs(p).toFixed(1).replace('.', ',') + '%';
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

// Дни считаем целыми числами (сутки от 1970 года), чтобы не путаться с часовыми поясами.
const dayOf = (y, m, d) => Math.floor(Date.UTC(y, m, d) / 864e5);
const info = n => { const x = new Date(n * 864e5); return { y: x.getUTCFullYear(), m: x.getUTCMonth(), d: x.getUTCDate(), w: (x.getUTCDay() + 6) % 7 }; };
const today = () => { const t = new Date(); return dayOf(t.getFullYear(), t.getMonth(), t.getDate()); };
const dm = n => { const i = info(n); return i.d + ' ' + MS[i.m]; };
const full = n => { const i = info(n); return i.d + ' ' + MG[i.m] + ' ' + i.y; };
const rangeLbl = (a, b) => { if (a === b) return dm(a); const x = info(a), y = info(b); return x.m === y.m ? x.d + '–' + y.d + ' ' + MS[x.m] : dm(a) + ' – ' + dm(b); };
const iso = n => { const i = info(n); return i.y + '-' + String(i.m + 1).padStart(2, '0') + '-' + String(i.d).padStart(2, '0'); };
const fromIso = s => { const [y, m, d] = s.split('-').map(Number); return dayOf(y, m - 1, d); };

// ---- хранение ----
let E = [];
try { E = JSON.parse(localStorage.getItem('earnings') || '[]'); if (!Array.isArray(E)) E = []; } catch (e) { E = []; }
const save = () => { try { const j = JSON.stringify(E); localStorage.setItem('earnings', j); localStorage.setItem('earnings_bak', j); } catch (e) {} };
try { if (!E.length) { const b = JSON.parse(localStorage.getItem('earnings_bak') || '[]'); if (Array.isArray(b) && b.length) E = b; } } catch (e) {}
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}

// ---- расчёты ----
const sum = (a, b, L = E) => L.reduce((s, x) => (x.day >= a && x.day <= b ? s + x.amount : s), 0);
const daily = (a, b) => { const r = new Array(Math.max(b - a + 1, 0)).fill(0); E.forEach(x => { if (x.day >= a && x.day <= b) r[x.day - a] += x.amount; }); return r; };
const cumul = a => { let s = 0; return a.map(v => (s += v)); };
const spanOf = (p, n) => {
  const i = info(n);
  if (p === 'w') { const s = n - i.w; return { s, e: s + 6 }; }
  if (p === 'm') return { s: dayOf(i.y, i.m, 1), e: dayOf(i.y, i.m + 1, 0) };
  return { s: dayOf(i.y, 0, 1), e: dayOf(i.y, 11, 31) };
};
const back = (p, n) => { const i = info(n); return p === 'w' ? n - 7 : p === 'm' ? dayOf(i.y, i.m - 1, 1) : dayOf(i.y - 1, 0, 1); };
const elapsed = sp => { const e = Math.min(sp.e, today()); return { s: sp.s, e: e < sp.s ? sp.s : e }; };
// Изменение к прошлому периоду за то же число прошедших дней.
function delta(p, n, L = E) {
  const cur = elapsed(spanOf(p, n));
  const cs = sum(cur.s, cur.e, L);
  const pf = spanOf(p, back(p, n));
  const pe = Math.min(pf.s + (cur.e - cur.s), pf.e);
  const ps = sum(pf.s, pe, L);
  return ps > 0 ? (cs - ps) * 100 / ps : null;
}
function weeksOf(y, m) {
  const f = dayOf(y, m, 1), l = dayOf(y, m + 1, 0), t = today(), r = [];
  let s = f;
  while (s <= l) { const e = Math.min(s + (6 - info(s).w), l); r.push({ s, e, sum: sum(s, e), cur: t >= s && t <= e }); s = e + 1; }
  return r;
}
function monthsList() {
  const set = new Set(E.map(x => { const i = info(x.day); return i.y * 12 + i.m; }));
  const t = info(today()); set.add(t.y * 12 + t.m);
  return [...set].sort((a, b) => b - a).map(k => ({ y: Math.floor(k / 12), m: k % 12 }));
}

// ---- анимации ----
function countUp(el, to, dur = 1000) {
  const from = el._v || 0;
  cancelAnimationFrame(el._r);
  const t0 = performance.now();
  const step = now => {
    const t = clamp((now - t0) / dur, 0, 1), p = 1 - Math.pow(1 - t, 3);
    el.textContent = money(from + (to - from) * p);
    if (t < 1 && el.isConnected) el._r = requestAnimationFrame(step); else { el.textContent = money(to); el._v = to; }
  };
  el._r = requestAnimationFrame(step);
}

function niceCeil(v) {
  if (v <= 0) return 1;
  const mag = Math.pow(10, Math.floor(Math.log10(v))), n = v / mag;
  return Math.ceil((n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * mag);
}

function setup(cv) {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const W = cv.clientWidth, H = cv.clientHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  const c = cv.getContext('2d'); c.scale(dpr, dpr);
  return { c, W, H };
}

/* Биржевой график: линия и заливка выезжают слева направо, столбики дней растут вслед,
   на конце пульсирует точка с меткой суммы. o: {cum,total,labels,bars,seps} */
function chart(cv, o) {
  const { c, W, H } = setup(cv);
  const cum = o.cum, n = cum.length;
  if (!n) return;
  const days = Math.max(o.total, n);
  const rp = 52, lh = 22, bh = o.bars ? 44 : 0, bg = o.bars ? 10 : 0, pw = W - rp, top = 10, lb = H - lh - bh - bg;
  const last = cum[n - 1], nm = niceCeil(Math.max(last, 1));
  const X = i => (days <= 1 ? 0 : pw * i / (days - 1)), Y = v => lb - v / nm * (lb - top);
  const t0 = performance.now(), DUR = 1300;
  const maxBar = o.bars ? Math.max(1, ...o.bars) : 1;
  function draw(p, now) {
    c.clearRect(0, 0, W, H);
    c.font = '11px ' + MONO; c.textBaseline = 'middle';
    [0, nm / 2, nm].forEach((v, k) => {
      const y = Y(v);
      c.strokeStyle = '#1E232A'; c.lineWidth = 1; c.setLineDash(k ? [3, 4] : []);
      c.beginPath(); c.moveTo(0, y); c.lineTo(pw, y); c.stroke(); c.setLineDash([]);
      c.fillStyle = '#8D96A0'; c.textAlign = 'left'; c.fillText(short(Math.round(v)), pw + 8, y);
    });
    const base = lb + bg + bh;
    (o.seps || []).forEach(i => {
      c.strokeStyle = '#2A323C'; c.setLineDash([2, 4]); c.beginPath(); c.moveTo(X(i), top); c.lineTo(X(i), base); c.stroke(); c.setLineDash([]);
    });
    const xl = X(n - 1);
    c.save(); c.beginPath(); c.rect(0, 0, xl * p + 1, H); c.clip();
    const g = c.createLinearGradient(0, top, 0, lb);
    g.addColorStop(0, 'rgba(61,220,151,.22)'); g.addColorStop(1, 'rgba(61,220,151,0)');
    c.beginPath(); cum.forEach((v, i) => (i ? c.lineTo(X(i), Y(v)) : c.moveTo(X(i), Y(v))));
    c.lineTo(xl, lb); c.lineTo(X(0), lb); c.closePath(); c.fillStyle = g; c.fill();
    c.beginPath(); cum.forEach((v, i) => (i ? c.lineTo(X(i), Y(v)) : c.moveTo(X(i), Y(v))));
    c.strokeStyle = '#3DDC97'; c.lineWidth = 2; c.lineJoin = 'round'; c.lineCap = 'round'; c.stroke();
    c.restore();
    if (o.bars) {
      c.strokeStyle = '#1E232A'; c.beginPath(); c.moveTo(0, base); c.lineTo(pw, base); c.stroke();
      const bw = Math.max(2, Math.min(8, pw / days * .6));
      o.bars.forEach((v, i) => {
        if (v <= 0) return;
        const h = v / maxBar * bh * clamp(p * (n + 3) - i, 0, 1);
        c.fillStyle = 'rgba(61,220,151,.55)'; c.beginPath();
        if (c.roundRect) c.roundRect(X(i) - bw / 2, base - h, bw, h, 2); else c.rect(X(i) - bw / 2, base - h, bw, h);
        c.fill();
      });
    }
    c.fillStyle = '#8D96A0'; c.textAlign = 'center';
    (o.labels || []).forEach(([i, t]) => { const w = c.measureText(t).width; c.fillText(t, clamp(X(i), w / 2, pw - w / 2), H - 9); });
    const ma = clamp((p - .88) / .12, 0, 1);
    if (ma > 0) {
      const y = Y(last), pu = (now % 1700) / 1700;
      c.fillStyle = 'rgba(61,220,151,' + (.35 * (1 - pu) * ma) + ')'; c.beginPath(); c.arc(xl, y, 6 + 12 * pu, 0, 7); c.fill();
      c.fillStyle = 'rgba(61,220,151,' + ma + ')'; c.beginPath(); c.arc(xl, y, 4 * ma, 0, 7); c.fill();
      c.font = '600 11px ' + MONO;
      const tx = tagNum(last), w = c.measureText(tx).width + 12, tl = Math.min(xl + 10, W - w);
      c.fillStyle = 'rgba(61,220,151,' + ma + ')'; c.beginPath();
      if (c.roundRect) c.roundRect(tl, y - 9, w, 18, 4); else c.rect(tl, y - 9, w, 18);
      c.fill();
      c.fillStyle = 'rgba(4,33,15,' + ma + ')'; c.textAlign = 'left'; c.fillText(tx, tl + 6, y + .5);
    }
  }
  const frame = now => {
    if (!cv.isConnected) return;
    const t = clamp((now - t0) / DUR, 0, 1);
    draw(1 - Math.pow(1 - t, 3), now);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}

/* Мини-график в строке месяца: рисуется слева направо с задержкой. */
function spark(cv, vals, color, delay) {
  const { c, W, H } = setup(cv);
  const t0 = performance.now() + delay, pad = 2;
  const lo = Math.min(...vals), hi = Math.max(...vals), sp = hi - lo < 1 ? 1 : hi - lo;
  const pts = vals.length < 2 ? [[0, H / 2], [W, H / 2]] : vals.map((v, i) => [W * i / (vals.length - 1), pad + (H - 2 * pad) * (1 - (v - lo) / sp)]);
  const frame = now => {
    if (!cv.isConnected) return;
    const t = clamp((now - t0) / 900, 0, 1), p = 1 - Math.pow(1 - t, 3);
    c.clearRect(0, 0, W, H);
    c.save(); c.beginPath(); c.rect(0, 0, W * p + 1, H); c.clip();
    c.beginPath(); pts.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y)));
    c.strokeStyle = color; c.lineWidth = 2; c.lineJoin = 'round'; c.lineCap = 'round'; c.stroke(); c.restore();
    if (t < 1) requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}

// ---- разбивка по категориям ----
function splitHtml(a, b, i) {

  const leg = CATS.map((c, k) => (sums[k] ? `<div class="lg"><i class="dot" style="background:${c.color}"></i><span style="flex:1">${c.name}</span><b class="mono" style="font-size:14px;font-weight:500">${money(sums[k])}</b><span class="mono mu" style="width:46px;text-align:right;font-size:13px">${Math.round(sums[k] * 100 / tot)}%</span></div>` : '')).join('');

function viewOverview() {

function renderBody(v) {

      html += `<div class="row mrow pr ap" style="--i:${4 + k}" data-y="${x.y}" data-m="${x.m}"><div class="nm"><b>${MN[x.m]}</b><small>${rangeLbl(s2.s, s2.e)}${isCur ? ' · идёт' : ''}</small></div><canvas class="spark"></canvas><div class="right"><b>${money(s)}</b>${dtxt(dl)}</div>${IC.chev()}</div>`;

// ---- месяц по неделям ----
let openWeek = -1;

function viewMonth(a) {
  const v = mk('<div class="view"></div>');

function renderMonth(v, y, m, anim) {
  v.classList.toggle('noanim', !anim);
  const keep = v.scrollTop;
  const first = dayOf(y, m, 1), last = dayOf(y, m + 1, 0), sp = elapsed({ s: first, e: last });
  const days = daily(sp.s, sp.e), cum = cumul(days), total = cum.length ? cum[cum.length - 1] : 0;
  const d = delta('m', first), weeks = weeksOf(y, m), totalDays = last - first + 1;
  const seps = weeks.slice(1).map(w => w.s - first);
  const labels = weeks.map(w => [((w.s - first) + (w.e - first)) / 2, w.s === w.e ? String(info(w.s).d) : info(w.s).d + '–' + info(w.e).d]);
  const maxSum = Math.max(0, ...weeks.map(w => w.sum)), bestSum = Math.max(0, ...weeks.filter(w => !w.cur).map(w => w.sum));
  const best = Math.max(0, ...days), avg = days.length ? Math.round(total / days.length) : 0;
  const bestDay = best > 0 ? sp.s + days.indexOf(best) : null;

  let html = `<div class="top ap" style="--i:0"><button class="sq pr bk1">${IC.back}</button><div><h1>${MN[m]} ${y}</h1><small>По неделям</small></div></div>
<div class="ap" style="--i:1;margin-top:24px"><div class="lbl">Итого за месяц</div><div class="tot"></div><div class="dl">${chip(d)}<span>${d == null ? 'пока не с чем сравнить' : 'к прошлому месяцу'}</span></div></div>
<div class="ap" style="--i:2"><canvas class="chart" style="height:230px"></canvas></div>
<div class="th ap" style="--i:3"><span class="lbl" style="flex:1">Неделя</span><span class="lbl" style="width:100px">Сумма</span><span class="lbl" style="width:74px">К пред.</span><span style="width:18px"></span></div>`;
  let k = -1;
  for (let i = weeks.length - 1; i >= 0; i--) {
    if (weeks[i].s > today()) continue;
    k++;
    const w = weeks[i], prev = i > 0 ? weeks[i - 1].sum : 0, n = w.e - w.s + 1;
    const wd = i > 0 && !w.cur && prev > 0 ? (w.sum - prev) * 100 / prev : null;
    const isBest = !w.cur && w.sum > 0 && w.sum === bestSum, open = openWeek === w.s;
    const es = E.filter(x => x.day >= w.s && x.day <= w.e).sort((p, q) => q.day - p.day || q.id - p.id);
    const list = es.length ? es.map(x => `<div class="er" data-id="${x.id}"><div class="nm"><b>${dm(x.day)} · ${WS[info(x.day).w]}</b><small><i class="dot" style="background:${catOf(x).color}"></i>${catOf(x).name}${x.note ? ' · ' + esc(x.note) : ''}</small></div><div class="am">+${money(x.amount)}</div><button class="x pr" aria-label="Удалить запись">${IC.x}</button></div>`).join('')
      : '<div class="mu" style="padding:8px 0;font-size:14px">На этой неделе записей нет</div>';
    html += `<div class="wk ap" style="--i:${4 + k}" data-s="${w.s}"><div class="hr pr"><div class="nm"><b>${rangeLbl(w.s, w.e)}</b><small style="color:${isBest ? 'var(--g)' : 'var(--mu)'}">${w.cur ? 'идёт · ' + n + ' дн.' : isBest ? 'лучшая неделя' : n + ' дн.'}</small></div><div class="sm">${money(w.sum)}</div><div class="dd">${dtxt(wd)}</div>${IC.chev(open)}</div><div class="gb"><i data-f="${maxSum ? w.sum / maxSum : 0}" style="background:${isBest ? 'var(--g)' : 'var(--bar)'}"></i></div><div class="xp${open ? ' open' : ''}"><div><div style="height:10px"></div>${list}<div style="height:6px"></div></div></div></div>`;
  }
  html += `<div class="tiles ap" style="--i:${6 + k};margin-top:20px">${tile('Среднее в день', money(avg), 'за ' + days.length + ' дн.')}${tile('Лучший день', bestDay == null ? '—' : money(best), bestDay == null ? 'пока нет' : dm(bestDay))}</div>`;
  html += splitHtml(sp.s, sp.e, 7 + k);
  v.innerHTML = html;
  animSplit(v);
  v.scrollTop = keep;

  $('.bk1', v).onclick = () => history.back();
  const tot = $('.tot', v); tot._v = 0; countUp(tot, total);
  chart($('canvas.chart', v), { cum, total: totalDays, labels, bars: days, seps });
  $$('.gb i', v).forEach((el, k) => setTimeout(() => (el.style.width = (+el.dataset.f * 100) + '%'), 500 + k * 140));

    $('.hr', wk).onclick = () => {
      const s = +wk.dataset.s; openWeek = openWeek === s ? -1 : s;
      $$('.wk', v).forEach(o => {
        const op = +o.dataset.s === openWeek;
        $('.xp', o).classList.toggle('open', op);
        $('.chev', o).style.transform = op ? 'rotate(90deg)' : '';
      });
    };
  });
  $$('.er .x', v).forEach(b => (b.onclick = () => {
    const row = b.closest('.er'); row.classList.add('gone');
    setTimeout(() => { E = E.filter(x => x.id !== +row.dataset.id); save(); renderMonth(v, y, m, false); }, 300);
  }));
}

    v.innerHTML = `<div class="top ap" style="--i:0"><button class="sq pr bk1">${IC.back}</button><div><h1>Новая запись</h1><small class="mo"></small></div></div>

<div class="sumc ap" style="--i:5"><div class="sl"><span class="bf"></span><b class="bv"></b></div><div class="sl"><span>Эта запись</span><b class="g ev"></b></div><hr><div class="sl" style="height:auto"><span>Станет</span><div style="text-align:right"><b class="af" style="font:600 20px var(--mono);display:block;color:var(--tx)"></b><span class="dd2"></span></div></div></div>

// ---- резервная копия ----
async function exportData() {
  const name = 'zarabotok-' + iso(today()) + '.json';
  const file = new File([JSON.stringify(E)], name, { type: 'application/json' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Копия записей' }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function importData(f, v) {
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const arr = JSON.parse(r.result);
      if (!Array.isArray(arr)) throw 0;
      const ids = new Set(E.map(x => x.id)); let added = 0;
      arr.forEach(x => { if (x && Number.isFinite(x.id) && Number.isFinite(x.day) && Number.isFinite(x.amount) && !ids.has(x.id)) { E.push({ id: x.id, day: x.day, amount: x.amount, note: String(x.note || ''), cat: CATS.some(c => c.id === x.cat) ? x.cat : 'work' }); ids.add(x.id); added++; } });
      save(); lastTotal = 0; renderBody(v);
      alert('Добавлено записей: ' + added);
    } catch (e) { alert('Не удалось прочитать файл. Нужна копия, сохранённая из этого приложения.'); }
  };
  r.readAsText(f);
}
